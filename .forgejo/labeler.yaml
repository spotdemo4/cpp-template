# https://github.com/actions/labeler

actions:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .forgejo/workflows/**

cpp:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.{c,cc,cpp,cxx,h,hh,hpp,hxx}"
          - "**/CMakeLists.txt"
          - "**/*.cmake"

nix:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.nix"
          - "**/flake.lock"
